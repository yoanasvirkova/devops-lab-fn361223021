---
# Lab 07: four empty Debian servers -> Notes API behind nginx.
# Run from ansible/: ansible-playbook site.yml

# Част Б: base packages for every server.
- name: Base packages on all servers
  hosts: all
  become: true
  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - acl   # needed for become_user to an unprivileged user (postgres)
        state: present
        update_cache: true
        cache_valid_time: 3600

# Част В: the database.
- name: PostgreSQL database
  hosts: db
  become: true
  vars:
    db_name: notes
    db_user: notes
    db_password: secret
  tasks:
    - name: Install PostgreSQL and psycopg2
      ansible.builtin.apt:
        name:
          - postgresql
          - python3-psycopg2
        state: present

    - name: Listen on all addresses
      ansible.builtin.lineinfile:
        path: /etc/postgresql/17/main/postgresql.conf
        regexp: "^#?listen_addresses"
        line: "listen_addresses = '*'"
      notify: Restart PostgreSQL

    - name: Allow password logins from the network
      ansible.builtin.lineinfile:
        path: /etc/postgresql/17/main/pg_hba.conf
        line: "host all all 0.0.0.0/0 scram-sha-256"
      notify: Restart PostgreSQL

    # On Debian "postgresql" is only a wrapper; the real server is postgresql@17-main.
    - name: PostgreSQL is started and enabled
      ansible.builtin.service:
        name: postgresql@17-main
        state: started
        enabled: true

    # Apply the config changes now, before we connect to create the user and db.
    - name: Run pending handlers
      ansible.builtin.meta: flush_handlers

    - name: Create the database user
      community.postgresql.postgresql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
      become_user: postgres

    - name: Create the database
      community.postgresql.postgresql_db:
        name: "{{ db_name }}"
        owner: "{{ db_user }}"   # owner can create tables in schema public (PostgreSQL 15+)
      become_user: postgres

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted

# Част Г: the web servers.
- name: Notes API on the web servers
  hosts: web
  become: true
  vars:
    repo_url: https://github.com/yoanasvirkova/devops-lab-fn361223021.git
    database_url: postgresql://notes:secret@db:5432/notes
  tasks:
    - name: Install Python tools and git
      ansible.builtin.apt:
        name:
          - python3-venv
          - python3-packaging   # the pip module needs it
          - git
        state: present

    - name: Get the code
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: /opt/notes
        version: main
      notify: Restart notes

    - name: Install requirements in a virtualenv
      ansible.builtin.pip:
        requirements: /opt/notes/requirements.txt
        virtualenv: /opt/notes/.venv
        virtualenv_command: python3 -m venv

    - name: Systemd unit for the app
      ansible.builtin.template:
        src: templates/notes.service.j2
        dest: /etc/systemd/system/notes.service
        mode: "0644"
      notify: Restart notes

    - name: Notes is started and enabled
      ansible.builtin.systemd:
        name: notes
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Restart notes
      ansible.builtin.systemd:
        name: notes
        state: restarted
        daemon_reload: true

# Част Д: the load balancer.
- name: nginx load balancer
  hosts: lb
  become: true
  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: nginx config with all web servers
      ansible.builtin.template:
        src: templates/nginx-default.j2
        dest: /etc/nginx/sites-available/default
        mode: "0644"
      notify: Reload nginx

    - name: nginx is started
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
